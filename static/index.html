<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POTA Planner</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet.markercluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div id="topbar">
    <span id="app-title">POTA Planner</span>
    <div id="topbar-controls">
      <div id="filter-buttons">
        <button class="filter-btn active" data-filter="activated"   title="Show activated parks">Activated</button>
        <button class="filter-btn active" data-filter="wishlist"    title="Show wishlisted parks">Wishlist</button>
        <button class="filter-btn active" data-filter="unactivated" title="Show unactivated parks">Unactivated</button>
      </div>
      <div id="search-wrapper">
        <input type="text" id="search-input" placeholder="Search park name or reference…" autocomplete="off">
        <div id="search-dropdown" class="hidden"></div>
      </div>
      <button id="btn-import-csv">Import CSV</button>
    </div>
  </div>

  <div id="main">
    <div id="map"></div>
    <div id="side-panel" class="hidden">
      <div id="panel-header">
        <button id="panel-close" title="Close">&times;</button>
        <div id="panel-title-area">
          <h2 id="panel-park-name">Loading…</h2>
          <div id="panel-meta">
            <span id="panel-reference"></span>
            <a id="panel-pota-link" href="#" target="_blank" rel="noopener">pota.app ↗</a>
            <a id="panel-maps-link" href="#" target="_blank" rel="noopener">Google Maps ↗</a>
          </div>
          <div id="panel-badges">
            <span id="badge-activated" class="badge hidden"></span>
            <span id="badge-count" class="badge badge-count hidden"></span>
            <button id="btn-wishlist" title="Toggle wishlist">&#9733;</button>
          </div>
        </div>
      </div>
      <div id="panel-body">
        <!-- Populated by app.js -->
      </div>
    </div>
  </div>

  <!-- Import CSV Modal -->
  <div id="modal-import" class="modal hidden">
    <div class="modal-box">
      <h3>Import Activations CSV</h3>
      <p>Export your activator stats from <a href="https://pota.app/#/profile" target="_blank" rel="noopener">pota.app → My Stats → Export CSV</a>, then select the file below.</p>
      <input type="file" id="import-file-input" accept=".csv">
      <div id="import-result"></div>
      <div class="modal-actions">
        <button id="btn-import-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Log Activation Modal -->
  <div id="modal-activation" class="modal hidden">
    <div class="modal-box">
      <h3>Log Activation</h3>
      <form id="form-activation">
        <label>Date <input type="date" name="activation_date" required></label>
        <label>Bands / Modes <input type="text" name="bands_modes" placeholder="40m SSB, 20m FT8"></label>
        <label>QSO Count <input type="number" name="qso_count" min="0" value="0"></label>
        <label>Cell Service <input type="text" name="cell_service_actual" placeholder="Verizon good, AT&T none"></label>
        <label>Would Return
          <div id="star-rating" class="star-row">
            <span class="star" data-v="1">&#9733;</span>
            <span class="star" data-v="2">&#9733;</span>
            <span class="star" data-v="3">&#9733;</span>
            <span class="star" data-v="4">&#9733;</span>
            <span class="star" data-v="5">&#9733;</span>
          </div>
          <input type="hidden" name="would_return" value="">
        </label>
        <label>Notes <textarea name="post_notes" rows="3"></textarea></label>
        <div class="modal-actions">
          <button type="button" id="btn-activation-cancel">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="hidden">
    <div id="lightbox-backdrop"></div>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-close">&times;</button>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
